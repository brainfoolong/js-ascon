name: NodeJs tests
on:
  push:
jobs:
  tests:
    strategy:
      matrix:
        node-version: [ '14.x', '16.x', '18.x' ,'20.x' ,'latest']
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: node tests/tests-node.js